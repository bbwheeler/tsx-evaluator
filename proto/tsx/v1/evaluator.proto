syntax = "proto3";

package tsx.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/example/tsx-evaluator/gen/tsx/v1;tsxv1";

// ScoreSet holds all evaluation scores for a single stock symbol.
message ScoreSet {
  string symbol = 1;

  // --- Core financial health score ---
  // Composite of Piotroski F-Score (profitability/leverage/margin/efficiency) and
  // supplementary health metrics (FCF conversion, debt quality, margin stability).
  double financials = 2;

  // --- Revenue and earnings momentum ---
  // Measures accelerating fundamentals: revenue acceleration, margin expansion,
  // operating leverage, cash flow trend. High scores indicate a company improving fast.
  double growth_momentum = 7;

  // --- Sentiment score ---
  // LLM-analyzed sentiment from news and social media for the specific stock.
  double sentiment = 3;

  // --- Leadership quality ---
  // Executive tenure, stability, and board composition score.
  double leadership = 4;

  // --- Sector/Industry tailwinds ---
  // Sentiment toward the company's sector/industry (macro opportunity).
  double type_sentiment = 5;

  // --- Valuation fairness ---
  // Compares price to fundamental value: P/E, EV/EBITDA, Price-to-FCF vs industry norm.
  // Penalizes overvaluation that could crush long-term returns even in great companies.
  double valuation_fairness = 8;

  google.protobuf.Timestamp evaluated_at = 6;
}

// --- GetScores -------------------------------------------------------

message GetScoresRequest {
  string symbol = 1;
}

message GetScoresResponse {
  ScoreSet scores = 1;
}

// --- ListScoredStocks ------------------------------------------------

enum ScoreMetric {
  SCORE_METRIC_UNSPECIFIED = 0;
  SCORE_METRIC_FINANCIALS = 1;
  SCORE_METRIC_GROWTH_MOMENTUM = 9;
  SCORE_METRIC_SENTIMENT = 2;
  SCORE_METRIC_LEADERSHIP = 3;
  SCORE_METRIC_TYPE_SENTIMENT = 4;
  SCORE_METRIC_VALUATION_FAIRNESS = 10;
}

// ScoreWeights provides per-metric weights for a composite score.
message ScoreWeights {
  double financials = 1;
  double growth_momentum = 7;
  double sentiment = 2;
  double leadership = 3;
  double type_sentiment = 4;
  double valuation_fairness = 8;
}

message ListScoredStocksRequest {
  oneof sort_by {
    ScoreMetric metric = 1;
    ScoreWeights weights = 2;
  }
  int32 page_size = 3;
  string page_token = 4;
  bool descending = 5;
}

message ListScoredStocksResponse {
  repeated ScoreSet scores = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// --- EvaluateNow -----------------------------------------------------

message EvaluateNowRequest {
  // If empty, re-evaluates all symbols. If set, evaluates just that symbol.
  string symbol = 1;
}

message EvaluateNowResponse {
  ScoreSet scores = 1;
}

// --- EvaluateStock ---------------------------------------------------

message EvaluateStockRequest {
  string symbol = 1;
}

message EvaluateStockResponse {
  ScoreSet scores = 1;
}

// --- Service ---------------------------------------------------------

service EvaluatorService {
  rpc GetScores(GetScoresRequest) returns (GetScoresResponse);
  rpc ListScoredStocks(ListScoredStocksRequest) returns (ListScoredStocksResponse);
  rpc EvaluateNow(EvaluateNowRequest) returns (EvaluateNowResponse);
  rpc EvaluateStock(EvaluateStockRequest) returns (EvaluateStockResponse);
}
