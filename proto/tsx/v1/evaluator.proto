syntax = "proto3";

package tsx.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/example/tsx-evaluator/gen/tsx/v1;tsxv1";

// ScoreSet holds all evaluation scores for a single stock symbol.
message ScoreSet {
  string symbol = 1;
  double financials = 2;
  double sentiment = 3;
  double leadership = 4;
  double type_sentiment = 5;
  google.protobuf.Timestamp evaluated_at = 6;
}

// --- GetScores -------------------------------------------------------

message GetScoresRequest {
  string symbol = 1;
}

message GetScoresResponse {
  ScoreSet scores = 1;
}

// --- ListScoredStocks ------------------------------------------------

enum ScoreMetric {
  SCORE_METRIC_UNSPECIFIED = 0;
  SCORE_METRIC_FINANCIALS = 1;
  SCORE_METRIC_SENTIMENT = 2;
  SCORE_METRIC_LEADERSHIP = 3;
  SCORE_METRIC_TYPE_SENTIMENT = 4;
}

// ScoreWeights provides per-metric weights for a composite score.
// The composite is: w_f*financials + w_s*sentiment + w_l*leadership + w_t*type_sentiment
message ScoreWeights {
  double financials = 1;
  double sentiment = 2;
  double leadership = 3;
  double type_sentiment = 4;
}

message ListScoredStocksRequest {
  // Sort by a single metric, OR by a weighted composite.
  oneof sort_by {
    ScoreMetric metric = 1;
    ScoreWeights weights = 2;
  }
  int32 page_size = 3;
  string page_token = 4;
  bool descending = 5;
}

message ListScoredStocksResponse {
  repeated ScoreSet scores = 1;
  string next_page_token = 2;
  int32 total_count = 3;
}

// --- EvaluateNow -----------------------------------------------------

message EvaluateNowRequest {}

message EvaluateNowResponse {
  ScoreSet scores = 1;
}

// --- Service ---------------------------------------------------------

service EvaluatorService {
  rpc GetScores(GetScoresRequest) returns (GetScoresResponse);
  rpc ListScoredStocks(ListScoredStocksRequest) returns (ListScoredStocksResponse);
  rpc EvaluateNow(EvaluateNowRequest) returns (EvaluateNowResponse);
}
